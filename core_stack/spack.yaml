# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - gcc@14%gcc@8.5.0 arch=linux-rocky8-x86_64
  - openmpi@5 ~lustre +internal-pmix fabrics=ucx schedulers=slurm ^ucx+ib_hw_tm+dc+rc+ud+mlx5_dv+rdmacm+cma+knem+xpmem+dm+verbs %gcc@14 arch=linux-rocky8-x86_64
  - openmpi@5 ~lustre +internal-pmix fabrics=ucx schedulers=slurm ^ucx+ib_hw_tm+dc+rc+ud+mlx5_dv+rdmacm+cma+knem+xpmem+dm+verbs %gcc@12.2.0 arch=linux-rocky8-x86_64
  view: false
  concretizer:
    unify: false
  config:
    install_tree:
      projections:
        all: '{name}/{version}/{hash:7}'
      root: /orcd/software/community/001/spack/stage/milechin/20260501/core/pkg
  modules:
    default:
      enable:
      - lmod
      lmod:
        hash_length: 0
        hide_implicits: true
        include: [gcc]
        exclude: ['%gcc@8.5.0']
        all:
          autoload: none
          conflict:
          - '{name}'
        core_compilers:
        - gcc@=8.5.0
        projections:
          all: '{name}/{version}'
      roots:
        lmod: /orcd/software/community/001/spack/stage/milechin/20260501/core/modulefiles
      arch_folder: false
  packages:
    gcc:
      externals:
      - spec: gcc@8.5.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
          flags: {}
          environment: {}
          extra_rpaths: []
      - spec: gcc@12.2.0 languages:='c,c++,fortran'
        prefix: /orcd/software/core/001/spack/pkg/gcc/12.2.0/yt6vabm
        extra_attributes:
          compilers:
            c: /orcd/software/core/001/spack/pkg/gcc/12.2.0/yt6vabm/bin/gcc
            cxx: /orcd/software/core/001/spack/pkg/gcc/12.2.0/yt6vabm/bin/g++
            fortran: /orcd/software/core/001/spack/pkg/gcc/12.2.0/yt6vabm/bin/gfortran
          flags: {}
          environment: {}
          extra_rpaths: []
    all:
      target: [x86_64]
      permissions:
        write: group
        group: orcd_rg_engagingsw_orcd-sw
    curl:
      externals:
      - spec: curl@7.61.1+gssapi+ldap+nghttp2
        prefix: /usr
    groff:
      externals:
      - spec: groff@1.22.3
        prefix: /usr
    openssh:
      externals:
      - spec: openssh@8.0p1
        prefix: /usr
    openssl:
      externals:
      - spec: openssl@1.1.1k
        prefix: /usr
    m4:
      externals:
      - spec: m4@1.4.18
        prefix: /usr
    gawk:
      externals:
      - spec: gawk@4.2.1
        prefix: /usr
    findutils:
      externals:
      - spec: findutils@4.6.0
        prefix: /usr
    diffutils:
      externals:
      - spec: diffutils@3.6
        prefix: /usr
    tar:
      externals:
      - spec: tar@1.30
        prefix: /usr
    git:
      externals:
      - spec: git@2.27.0~tcltk
        prefix: /usr
    coreutils:
      externals:
      - spec: coreutils@8.30
        prefix: /usr
    slurm:
      buildable: false
      externals:
      - spec: slurm@22.05.6~gtk~hdf5~hwloc~mariadb+pmix+readline~restd arch=linux-rocky8-x86_64
        prefix: /usr
    munge:
      buildable: false
      externals:
      - spec: munge@0.5.13 arch=linux-rocky8-x86_64
        prefix: /usr
  upstreams:
    core_stack:
      install_tree: /orcd/software/core/001/spack/pkg
